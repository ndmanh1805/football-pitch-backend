spring.application.name=football-pitch
# 1. Cấu hình thông tin đăng nhập MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/football_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=abc123!@#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Cấu hình Hibernate (Cơ chế tự động hóa Database)
# Lệnh 'update' sẽ tự động tạo bảng nếu chưa có, và giữ nguyên data nếu bảng đã tồn tại
spring.jpa.hibernate.ddl-auto=update

# 3. Cấu hình Debug (In log ra màn hình để kiểm soát)
# Bật tính năng in các câu lệnh SQL mà hệ thống tự sinh ra xuống Terminal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect